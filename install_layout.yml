---
- name: Install Nova XKB layout
  hosts: localhost

  vars:
    nova_input_sources: "[('xkb', 'us-nova')]"
    nova_xkb_options: "['shift:both_capslock']"
    nova_numlock_compatibility:
      - key: remember-numlock-state
        value: "false"
      - key: numlock-state
        value: "false"
    nova_gnome_extensions:
      - uuid: nova-level5-sentinel@wdcallahan
        files:
          - extension.js
          - metadata.json
      - uuid: nova-semantic-meta@wdcallahan
        files:
          - extension.js
          - metadata.json
    nova_gnome_extension_uuids: "{{ nova_gnome_extensions | map(attribute='uuid') | list }}"

  tasks:
    - name: Ensure user XKB directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_facts.env.HOME }}/.config/xkb/symbols"
        - "{{ ansible_facts.env.HOME }}/.config/xkb/rules"

    - name: Ensure Nova GNOME Shell extension directories exist
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/share/gnome-shell/extensions/{{ item.uuid }}"
        state: directory
        mode: "0755"
      loop: "{{ nova_gnome_extensions }}"
      loop_control:
        label: "{{ item.uuid }}"

    - name: Install Nova symbols file
      ansible.builtin.copy:
        src: files/us-nova
        dest: "{{ ansible_facts.env.HOME }}/.config/xkb/symbols/us-nova"
        mode: "0644"

    - name: Install Nova private evdev rules
      ansible.builtin.copy:
        src: files/evdev
        dest: "{{ ansible_facts.env.HOME }}/.config/xkb/rules/evdev"
        mode: "0644"

    # GNOME Shell may need a fresh session to discover newly installed source.
    # Enablement intent is managed separately and survives that boundary.
    - name: Install Nova GNOME Shell extensions
      ansible.builtin.copy:
        src: "files/gnome-shell/extensions/{{ item.0.uuid }}/{{ item.1 }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/gnome-shell/extensions/{{ item.0.uuid }}/{{ item.1 }}"
        mode: "0644"
      loop: "{{ nova_gnome_extensions | subelements('files') }}"
      loop_control:
        label: "{{ item.0.uuid }}/{{ item.1 }}"

    - name: Read enabled GNOME Shell extensions
      ansible.builtin.command:
        argv:
          - gsettings
          - get
          - org.gnome.shell
          - enabled-extensions
      register: current_gnome_shell_extensions
      changed_when: false

    # Preserve every existing extension and append only Nova's UUIDs. Writing
    # the GSettings membership also handles first installation before Shell
    # has discovered new source; it will load on the next fresh session.
    - name: Enable Nova GNOME Shell extensions persistently
      ansible.builtin.command:
        argv:
          - gsettings
          - set
          - org.gnome.shell
          - enabled-extensions
          - "{{ (((current_gnome_shell_extensions.stdout | regex_replace('^@as ', '') | from_yaml) + nova_gnome_extension_uuids) | unique | list) | to_json }}"
      when: (nova_gnome_extension_uuids | difference((current_gnome_shell_extensions.stdout | regex_replace('^@as ', '') | from_yaml)) | length) > 0
      changed_when: true

    - name: Verify Nova GNOME Shell extensions are enabled
      ansible.builtin.command:
        argv:
          - gsettings
          - get
          - org.gnome.shell
          - enabled-extensions
      register: verified_gnome_shell_extensions
      changed_when: false
      failed_when: (nova_gnome_extension_uuids | difference((verified_gnome_shell_extensions.stdout | regex_replace('^@as ', '') | from_yaml)) | length) > 0

    - name: Remove obsolete Nova post-rules file
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/xkb/rules/evdev.post"
        state: absent

    # Mutter restores remembered NumLock by locking raw Mod2. Nova uses Mod2
    # for LevelFive, so both GNOME settings must stay false.
    - name: Read GNOME NumLock compatibility settings
      ansible.builtin.command:
        argv:
          - gsettings
          - get
          - org.gnome.desktop.peripherals.keyboard
          - "{{ item.key }}"
      loop: "{{ nova_numlock_compatibility }}"
      loop_control:
        label: "{{ item.key }}"
      register: current_numlock_compatibility
      changed_when: false

    - name: Disable GNOME NumLock restoration for Nova Level5
      ansible.builtin.command:
        argv:
          - gsettings
          - set
          - org.gnome.desktop.peripherals.keyboard
          - "{{ item.item.key }}"
          - "{{ item.item.value }}"
      loop: "{{ current_numlock_compatibility.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.stdout | trim != item.item.value
      changed_when: true

    - name: Verify GNOME NumLock cannot pre-lock Nova Level5
      ansible.builtin.command:
        argv:
          - gsettings
          - get
          - org.gnome.desktop.peripherals.keyboard
          - "{{ item.key }}"
      loop: "{{ nova_numlock_compatibility }}"
      loop_control:
        label: "{{ item.key }}"
      register: verified_numlock_compatibility
      changed_when: false
      failed_when: verified_numlock_compatibility.stdout | trim != item.value

    - name: Read current GNOME input sources
      ansible.builtin.command:
        cmd: gsettings get org.gnome.desktop.input-sources sources
      register: current_sources
      changed_when: false

    - name: Set Nova as the only GNOME input source
      ansible.builtin.command:
        cmd: "gsettings set org.gnome.desktop.input-sources sources \"{{ nova_input_sources }}\""
      when: current_sources.stdout | trim != nova_input_sources
      changed_when: true

    - name: Verify Nova is the only GNOME input source
      ansible.builtin.command:
        cmd: gsettings get org.gnome.desktop.input-sources sources
      register: verified_sources
      changed_when: false
      failed_when: verified_sources.stdout | trim != nova_input_sources

    - name: Read current XKB options
      ansible.builtin.command:
        cmd: gsettings get org.gnome.desktop.input-sources xkb-options
      register: current_xkb_options
      changed_when: false

    - name: Set Nova XKB options
      ansible.builtin.command:
        cmd: "gsettings set org.gnome.desktop.input-sources xkb-options \"{{ nova_xkb_options }}\""
      when: current_xkb_options.stdout | trim != nova_xkb_options
      changed_when: true

    - name: Verify Nova XKB options
      ansible.builtin.command:
        cmd: gsettings get org.gnome.desktop.input-sources xkb-options
      register: verified_xkb_options
      changed_when: false
      failed_when: verified_xkb_options.stdout | trim != nova_xkb_options
